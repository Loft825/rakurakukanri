<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Database</title>
</head>

<body>

  <h1>RP Database</h1>

  <input id="username" type="text" placeholder="Robloxユーザー名">
  <button onclick="searchPlayer()">検索</button>

  <div id="result"></div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "sb_publishable_vQ9rSiRlomm-Ekka7oyGRg_m7XevQNA";
    async function searchPlayer() {
      const username = document.getElementById("username").value.trim();
      const result = document.getElementById("result");

      if (!username) {
        result.innerHTML = "ユーザー名を入力してください。";
        return;
      }

      result.innerHTML = "検索中...";

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/players?username=eq.${encodeURIComponent(username)}&select=*`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if (!response.ok) {
        result.innerHTML = "データ取得に失敗しました。";
        return;
      }

      const data = await response.json();

      if (data.length === 0) {
        result.innerHTML = "プレイヤーが見つかりませんでした。";
        return;
      }

      const player = data[0];

      result.innerHTML = `
        <h2>${player.username}</h2>
        <p>階級：${player.rank}</p>
        <p>ポイント：${player.points}pt</p>
      `;
    }
  </script>

</body>
</html>
